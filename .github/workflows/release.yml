name: Release npm & Official MCP Registry
on:
  push:
    tags:
      - "v*.*.*"
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad7ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm for OIDC Publishing
        run: npm install -g npm@latest
      - name: Run full test & release gates
        run: |
          npm test
          npm run build
      - name: Publish to npm via OIDC
        run: npm publish --access public
      - name: Publish to Official MCP Registry
        run: |
          set -euo pipefail
          m="$(uname -m)"
          a="$(echo "$m" | sed 's/x86_64/amd64/')"
          a="$(echo "$a" | sed 's/aarch64/arm64/')"
          tar_nm="mcp-publisher_linux_${a}.tar.gz"
          u="https://github.com/modelcontextprotocol"
          u="${u}/registry/releases/latest/download"
          curl -fsSLO "${u}/${tar_nm}"
          tar xzf "${tar_nm}" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
